<script type="module">
/* ═══ GHOST HUNT · a Multiplayer Agent starter ═════════════════════════════════════════
 * Find the evidence. Name the ghost. Get out alive. Co-op, 1–4 players; bot investigators
 * fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ timers, sanity, the ghost's speed and hunts, the house map and its rooms
 *   GHOSTS ........ the evidence list, the tools that find it, the 8 ghost types
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED SECRET . the Seal helper: the ghost type is encrypted, never in plain state
 *   MAP ........... walls, rooms, paths (for the ghost and bots), line of sight
 *   SCENE ......... floors, walls, furniture, the van, lamps, evidence props
 *   PEOPLE ........ investigator and ghost models, flashlights
 *   HUNT (HOST) ... phases (brief, investigate, escape, reveal), testing evidence, the ghost,
 *                   its hunts, deaths, escapes and the bot investigators. Only the host runs these.
 *   ME ............ walking, aiming, tools, sanity. Each player writes only its own.
 *   HUD & RESULTS . tool readings, journal, team, results card, leaderboard
 *   INPUT & SOUND . keyboard, mouse, touch stick and buttons, WebAudio effects
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: position, facing, tool,
 *     sanity, moving, the round it is for) about 12 times a second, `hb` (heartbeat) once a
 *     second, `n`/`c` (name, color) and `pk` (public key, for the sealed ghost type) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `game`  {id, v, phase, timers, the ghost's room, evidence found and ruled out, the
 *                mark, who died or escaped, the reveal}: ONE JSON field, v only goes up
 *       `ghost` where the ghost is, whether it hunts, its last scare, test progress (10/s)
 *       `bots`  the bot investigators (10/s)
 *       `gbox`  the ghost type, SEALED to each player's key (see below)
 *   - The ghost type is hidden. The host picks it and keeps it in memory; it never goes into
 *     plain state until the reveal. A sealed copy for each player lets a new host open its
 *     own copy and carry on (a host who joined too late to have one picks a type that fits
 *     the evidence so far). The host deals, so it could peek: fine among friends.
 *   - Evidence: standing in the ghost's room holding a tool tests that evidence. The host
 *     reads every player's tool and position from `p`; with the right ghost the evidence
 *     shows up, otherwise after a while it's ruled out. No intent needed.
 *   - Intents to the host: "mark" {k} (we think it's ghost type k: the final hunt starts)
 *     and "again". Dying and escaping are decided by the host from everyone's positions.
 *   - A new round starts when the host bumps game.id; every client then resets.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "ghost-score": the round's score (right ghost, evidence, survivors).
 */

  briefMs: 4000,          // ms of title before the hunt starts

    { name: "Hall", r: [8, 6, 14, 10], lit: true, haunt: false, floor: "#5a5048" },

// ── GHOSTS ──────────────────────────────────────────────────────────────────────────
// Five evidences, one tool each. Every ghost type leaves exactly three of them.
const TOOLS = [
  { key: "EMF", name: "EMF meter", ev: "EMF level 5", color: "#ff5d5d" },
  { key: "TEMP", name: "Thermometer", ev: "Freezing temps", color: "#7ad8ff" },
  { key: "RADIO", name: "Spirit radio", ev: "Ghost voice", color: "#ffb347" },

  { key: "BOOK", name: "Ghost book", ev: "Ghost writing", color: "#f4e7c3" },

// ev: the three evidences (tool indexes). hunt: shifts the sanity it starts hunting at. speed: hunt speed ×.
const TYPES = [
  { name: "Whisperer", ev: [1, 2, 4], note: "Talks a lot, writes a lot.", hunt: 0, speed: 1 },
  { name: "Cold Lady", ev: [0, 1, 3], note: "Hunts a little sooner.", hunt: 8, speed: 1 },
  { name: "Rattler", ev: [0, 3, 4], note: "Throws things around.", hunt: 0, speed: 1.05 },
  { name: "Weeping Child", ev: [1, 2, 3], note: "Slow, but patient.", hunt: 5, speed: 0.9 },
  { name: "Scribbler", ev: [0, 2, 4], note: "Leaves notes everywhere.", hunt: -5, speed: 1 },
  { name: "Hollow Man", ev: [0, 1, 2], note: "Fast when it hunts.", hunt: 0, speed: 1.15 },
  { name: "Lantern Eater", ev: [1, 3, 4], note: "Hates lit rooms.", hunt: 10, speed: 1 },
  { name: "Grudge", ev: [0, 2, 3], note: "Hunts late, hunts hard.", hunt: -10, speed: 1.1 },

const VOICES = ["…behind you…", "GET… OUT…", "…so cold…", "…mine…", "…here…", "…leave…"];
const BOT_NAMES = ["Kit", "Moss", "Juno", "Pip", "Rook", "Ivy"];
const COLORS = ["#c9b8ff", "#4da6ff", "#ff6fb5", "#52d273", "#ffb347", "#ff6a6a"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'ghost-hunt',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const PARAMS = new URLSearchParams(location.search), ATTRACT = PARAMS.has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},

}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;

    console.warn("Playing offline:", e && e.message);

  }

const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fb) { const raw = S.shared[key], m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }

const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

// ── SEALED SECRET ───────────────────────────────────────────────────────────────────
// Hidden info in a relay room. Everything in room state reaches every client, so the ghost
// type is written SEALED: encrypted so only one reader can open it. Each player publishes a
// public key in its own entity (`pk`); the host seals the type to each player's key and writes
// the boxes into shared `gbox`. A player's game opens its box only when it becomes the host.
//   - crypto.subtle needs https or localhost. Without it seal()/open() pass the value through.
//   - NEVER plaintext online: with no key for the recipient seal() returns "" (an empty box).
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const Seal = {
  pair: null,
  pub: "",
  keys: new Map(), // other player's public key -> derived AES key
  get on() { return !!(window.crypto && crypto.subtle); },
  /** Make this player's key pair. Returns the public key to publish: me.set("pk", pub). */
  async init() {
    if (!this.on) return "";
    this.pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    this.pub = b64(await crypto.subtle.exportKey("raw", this.pair.publicKey));
    return this.pub;
  },
  async key(otherPub) {
    let k = this.keys.get(otherPub);
    if (!k) {
      const theirs = await crypto.subtle.importKey("raw", unb64(otherPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      k = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, this.pair.privateKey, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
      this.keys.set(otherPub, k);
    }
    return k;
  },
  /** Seal any JSON value so only the holder of `toPub` (and you) can open it. */
  async seal(toPub, value) {
    if (!this.on) return "p:" + JSON.stringify(value);
    if (!toPub || !this.pair) return ""; // never plaintext: nobody can open an empty box
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(toPub), new TextEncoder().encode(JSON.stringify(value)));

  /** Open a box sealed by the player whose public key is `fromPub`. Null if it isn't for you. */
  async open(fromPub, box) {
    if (typeof box !== "string") return null;
    if (box.startsWith("p:")) return JSON.parse(box.slice(2));
    if (!this.on || !fromPub || !this.pair) return null;
    try {
      const [iv, ct] = box.split(".").map(unb64);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await this.key(fromPub), ct);

  },

// ── MAP ─────────────────────────────────────────────────────────────────────────────
if (ATTRACT) {
  Object.assign(CONFIG, { briefMs: 300, investMs: 60000, escapeMs: 9000, resultsMs: 2500, testMs: 4000, findMs: [900, 2000], botTest: 1, huntGap: [6500, 8000], huntMs: 5000, ambient: 2.1, huntBelow: 101 });

const MAP = CONFIG.map, MH = MAP.length, MW = MAP[0].length, TS = CONFIG.tile;
const cell = (cx, cz) => (MAP[cz] && MAP[cz][cx]) || "#";
const solid = (cx, cz) => "#xf%V".includes(cell(cx, cz));
const toCell = (v) => Math.floor(v / TS);

  if (ATTRACT) { for (const id of ["team", "big", "msg", "net", "clock", "readText"]) $(id).textContent = ""; $("evText").textContent = `Evidence ${found} / 3`; return; }
  const myOut = g.dead[net.sessionId] || g.out[net.sessionId];
  $("evText").textContent = `Evidence ${found} / 3 · Sanity ${Math.round(me.san)}%`;
  $("sanBar").style.width = me.san + "%"; $("sanBar").classList.toggle("low", me.san < CONFIG.huntBelow);
  const left = g.endsAt - t;
  $("clock").textContent = g.phase === "invest" ? `${fmt(Math.max(0, left))} to name the ghost` : g.phase === "escape" ? `GET TO THE VAN: ${fmt(Math.max(0, left))}` : "";
  $("clock").classList.toggle("late", g.phase === "escape" || (g.phase === "invest" && left < 30000));
  $("team").innerHTML = all.map((c) => `<div class="${c.mine ? "me" : ""} ${g.dead[c.id] ? "dead" : ""}">${esc(c.mine ? "You" : c.name)} ${g.dead[c.id] ? "💀" : g.out[c.id] ? "🚐" : Math.round(c.san) + "%"}</div>`).join("");
  $("big").innerHTML = g.phase === "brief" ? `Ghost Hunt<small>Find the ghost's cold room. Test with your tools. Name it in the journal, then run.</small>` : "";
  let msg = "";
  if (g.phase === "invest") {
    if (!me.firstAt) me.firstAt = t;
    if (g.dead[net.sessionId]) msg = "The ghost got you. Watch your team: they can still win.";
    else if (gs && gs.s === "hunt") msg = "IT'S HUNTING! Run outside or keep away from it.";
    else if (t - me.firstAt < 12000) msg = touchUI ? "Left thumb walks · tap a tool below · the ghost's room is cold" : "WASD walk · mouse aims · 1–5 pick a tool · J journal · the ghost's room is cold";
    else if (fits(g).length === 1) msg = touchUI ? "The evidence fits one ghost: tap Journal and mark it" : "The evidence fits one ghost: press J and mark it";
  } else if (g.phase === "escape") msg = myOut ? (g.out[net.sessionId] ? "You made it out!" : "The ghost got you. Watch your team run for the van.") : `${g.markBy ? esc(g.markBy) + " marked it. " : ""}It's furious. Get to the van!`;
  $("msg").textContent = msg;
  const R = reading(g, gs, performance.now() / 1000), pr = gs && gs.pr ? gs.pr[me.tool] : 0, inRoom = roomAt(me.x, me.z) === g.room;
  const status = g.found[me.tool] ? ` · ✓ found by ${esc(g.found[me.tool])}` : g.ruled[me.tool] ? ` · ✗ no ${evLow(me.tool)}` : inRoom && pr > 0 ? ` · testing ${pr}%` : "";
  $("readText").textContent = R.text + status;
  $("read").style.borderColor = R.hot ? "#9ff7c4" : "#ffffff22";
  $("probe").hidden = !(inRoom && pr > 0 && !g.found[me.tool] && !g.ruled[me.tool]); $("probeBar").style.width = pr + "%";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the ghost" : ""}`;
  $("jbtn").hidden = g.phase !== "invest";
  if (!$("journal").hidden) drawJournal(g);
  $("over").hidden = g.phase !== "reveal";
  if (g.phase === "reveal") {
    const T = TYPES[g.reveal];
    $("overTitle").textContent = T ? `It was the ${T.name}!` : "The ghost got away";
    $("overLine").textContent = g.mark < 0 ? "Nobody named it in time." : `${g.markBy ? g.markBy + " marked" : "You marked"} the ${TYPES[g.mark].name}: ${g.right ? "right! ✓" : "wrong ✗"}`;
    $("overScore").textContent = `Evidence ${found} · made it out ${Object.keys(g.out).length}/${g.crew || all.length} · score ${g.score}`;
    $("next").textContent = `Next house in ${Math.max(0, Math.ceil((g.nextAt - t) / 1000))}s`;
    if (boardFor !== g.id) { boardFor = g.id; showBoard(g); }
  }
}
let journalKey = "";
function drawJournal(g) {
  const key = JSON.stringify([g.found, g.ruled, picked]);
  if (key === journalKey) return; // redraw only on a change, so a click never lands on a replaced button
  journalKey = key;
  const ok = new Set(fits(g));
  $("jEv").innerHTML = TOOLS.map((T, k) => `<span class="${g.found[k] ? "y" : g.ruled[k] ? "n" : ""}">${g.found[k] ? "✓ " : ""}${T.ev}</span>`).join("");
  $("jList").innerHTML = TYPES.map((T, i) => `<button class="gh ${ok.has(i) ? "" : "no"} ${picked === i ? "sel" : ""}" data-i="${i}"><span>${T.name}<small>${T.note}</small></span><i>${T.ev.map((k) => TOOLS[k].key).join(" · ")}</i></button>`).join("");
  $("mark").disabled = picked < 0;
  $("mark").textContent = picked < 0 ? "Pick a ghost" : `Mark the ${TYPES[picked].name} and run`;
}
function openJournal() { const g = game(); if (!g || g.phase !== "invest") return; picked = -1; journalKey = ""; $("journal").hidden = false; drawJournal(g); }
function closeJournal() { $("journal").hidden = true; }
$("jbtn").onclick = openJournal; $("jClose").onclick = closeJournal;
$("jList").addEventListener("click", (e) => { const b = e.target.closest(".gh"); if (b) { picked = +b.dataset.i; drawJournal(game()); } });
$("mark").onclick = () => { if (picked < 0) return; if (isHost()) markIntent(picked, myName); else net.send("mark", { k: picked }); closeJournal(); };
function showBoard(g) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  const submit = me.roundId === g.id && g.score > 0 ? board.submit(g.score).catch(() => null) : Promise.resolve();
  submit.then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No hunts yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
/** Keep a color nobody else has: the later sessionId gives way, and the bots' colors count as taken. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = botList().map((b) => b.c);
  if (!others.some(([id, p]) => id < net.sessionId && p.c === myColor) && !bots.includes(myColor)) return;
  const used = new Set([...others.map(([, p]) => p.c), ...bots]);
  myColor = COLORS.find((c) => !used.has(c)) || myColor;
  net.me.set("c", myColor); if (me.g) me.g.userData.mat.color.set(myColor);
}
$("again").onclick = () => { if (isHost()) host.again = true; else net.send("again", {}); };

/** One-off effects worked out from what changed in state (so nobody misses one). */
let prevG = null, prevHunt = false;
function effects(g, gs) {
  if (prevG && prevG.id === g.id) {
    for (const k of Object.keys(g.found)) if (!prevG.found[k]) { toast(`${g.found[k]} found ${TOOLS[k].ev}!`); sound("found"); drawTools(); }
    for (const k of Object.keys(g.ruled)) if (!prevG.ruled[k]) { toast(`No ${evLow(k)} here`); drawTools(); }
    for (const id of Object.keys(g.dead)) if (!prevG.dead[id]) { const c = people().find((o) => o.id === id); if (c) burst(c.x, 1, c.z, "#b9a8ff", 22, 4); sound(id === net.sessionId ? "caught" : "thud"); if (id === net.sessionId) shake = 0.7; }
    if (g.phase === "escape" && prevG.phase !== "escape") { sound("roar"); shake = 0.5; }
    if (g.phase === "reveal" && prevG.phase !== "reveal") sound(g.right ? "win" : "lose");
  } else drawTools();
  const hunting = !!gs && gs.s === "hunt";
  if (hunting && !prevHunt) { sound("roar"); if (!ATTRACT) toast("The ghost is hunting!"); }
  prevHunt = hunting;
  prevG = g;
}

// ── INPUT & SOUND ───────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("run").hidden = !touchUI;
$("tools").hidden = ATTRACT; $("jbtn").hidden = true; $("read").hidden = ATTRACT;
if (touchUI) { document.body.classList.add("touch"); Object.assign($("net").style, { top: "calc(max(12px, env(safe-area-inset-top)) + 128px)", bottom: "auto", left: "16px", transform: "none" }); }
const KEYS = { w: "up", ArrowUp: "up", s: "down", ArrowDown: "down", a: "left", ArrowLeft: "left", d: "right", ArrowRight: "right", Shift: "run" };
addEventListener("keydown", (e) => {
  const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (k) { e.preventDefault(); input[k] = true; }
  if (e.repeat) return;
  const digit = /^(?:Digit|Numpad)([1-5])$/.exec(e.code); // by position, not character: Shift (run) turns "1" into "!"
  if (digit) setTool(+digit[1] - 1);
  if (e.key.toLowerCase() === "q") setTool((me.tool + 1) % TOOLS.length);
  if (e.key.toLowerCase() === "j") { if ($("journal").hidden) openJournal(); else closeJournal(); }
  if (e.key === "Escape") closeJournal();
});
addEventListener("keyup", (e) => { const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (k) input[k] = false; });
addEventListener("blur", () => { for (const k in input) input[k] = false; });
const cv = renderer.domElement;
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("wheel", (e) => setTool((me.tool + (e.deltaY > 0 ? 1 : TOOLS.length - 1)) % TOOLS.length), { passive: true });
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { aim.on = true; aim.nx = (e.clientX / innerWidth) * 2 - 1; aim.ny = -(e.clientY / innerHeight) * 2 + 1; }
  if (e.pointerId === stick.id) {
    const dx = e.clientX - stick.ox, dy = e.clientY - stick.oy, d = Math.hypot(dx, dy), k = Math.min(1, d / 50) / (d || 1);
    stick.x = dx * k; stick.y = dy * k; $("stick").firstElementChild.style.transform = `translate(${stick.x * 35}px, ${stick.y * 35}px)`;
  }
});
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (e.pointerType !== "mouse" && stick.id < 0) { stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY; Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false; }
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerId === stick.id) { stick.id = -1; stick.x = stick.y = 0; $("stick").hidden = true; } });
$("run").addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); input.run = true; $("run").classList.add("on"); });
for (const ev of ["pointerup", "pointercancel"]) $("run").addEventListener(ev, () => { input.run = false; $("run").classList.remove("on"); });
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card")) e.preventDefault(); }, { passive: false });

let AC = null;
function unlockAudio() { if (!AC && !ATTRACT) try { AC = new AudioContext(); } catch {} }
addEventListener("keydown", unlockAudio);
function sound(kind) {
  if (!AC) return;
  const t0 = AC.currentTime, tone = (f, d, type, v, f2, at = 0) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0 + at); o.frequency.exponentialRampToValueAtTime(f2, t0 + at + d);
    g.gain.setValueAtTime(v, t0 + at); g.gain.exponentialRampToValueAtTime(0.001, t0 + at + d); o.connect(g).connect(AC.destination); o.start(t0 + at); o.stop(t0 + at + d);
  };
  if (kind === "beat") tone(66, 0.16, "sine", 0.4, 40);
  if (kind === "click") tone(1200, 0.04, "square", 0.05, 900);
  if (kind === "found") { tone(660, 0.18, "triangle", 0.12, 660); tone(990, 0.3, "triangle", 0.12, 990, 0.12); }
  if (kind === "scare") tone(180, 0.5, "sawtooth", 0.05, 90);
  if (kind === "roar") { tone(90, 1.1, "sawtooth", 0.12, 45); tone(140, 0.9, "square", 0.05, 70); }
  if (kind === "caught") tone(420, 0.7, "sawtooth", 0.15, 50);
  if (kind === "thud") tone(200, 0.3, "sawtooth", 0.07, 60);
  if (kind === "win") { tone(523, 0.3, "triangle", 0.12, 523); tone(784, 0.5, "triangle", 0.12, 784, 0.2); }
  if (kind === "lose") tone(300, 1.0, "sawtooth", 0.08, 70);
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, shake = 0, nextBeat = 0;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.was = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: let the newer state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)), t = now / 1000; last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  if (isHost()) hostTick(dt, now); else host.was = false;
  const g = game();
  if (!g) { renderer.render(scene, camera); return; }
  const gs = ghostState();
  myTick(dt, g, gs); effects(g, gs);
  const playing = g.phase === "invest" || g.phase === "escape", hunting = !!gs && gs.s === "hunt" && playing;
  // People: everyone else eased toward where they last said they were, bots, then me.
  const seen = new Set(), drawn = [], live = new Set(livePlayers());
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const q = id !== net.sessionId && live.has(id) && posOf(id, p);
    if (!q || q.g !== g.id) continue;
    const v = viewOf(id, p.c || "#ccc", p.n || "Player"); seen.add(id); ease(v, q.x, q.z, q.h, dt);
    drawn.push({ v, id, tool: q.t || 0, moving: !!q.m });
  }
  for (const b of botList()) { const v = viewOf(b.i, b.c, b.n); seen.add(b.i); ease(v, b.x, b.z, b.h, dt); drawn.push({ v, id: b.i, tool: b.t || 0, moving: !!b.mv }); }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); }
  if (!me.g) me.g = makePerson(myColor, "");
  me.g.position.set(me.x, 0, me.z); me.g.rotation.y = me.h;
  for (const d of [...drawn, { v: { g: me.g }, id: net.sessionId, tool: me.tool, moving: me.mv }]) { d.dead = !!g.dead[d.id]; pose(d.v.g, d.dead, d.tool, d.moving, t); d.v.g.userData.lens.visible = !d.dead; }
  // Flashlights: mine first (it casts the shadows), then the nearest others. UV turns the beam purple.
  drawn.sort((a, b) => dist(a.v.g.position, me) - dist(b.v.g.position, me));
  const lit = [{ x: me.x, z: me.z, h: me.h, on: !g.dead[net.sessionId], uv: me.tool === 3 }, ...drawn.map((d) => ({ x: d.v.g.position.x, z: d.v.g.position.z, h: d.v.g.rotation.y, on: !d.dead, uv: d.tool === 3 }))];
  torches.forEach((L, i) => { const c = lit[i]; if (c) aimTorch(L, c, t, i, hunting && dist(c, ghostView) < 10); else L.intensity = 0; });
  // The ghost: invisible until it scares someone or hunts.
  if (gs) {
    if (isHost() || ghostView.fresh) Object.assign(ghostView, { x: gs.x, z: gs.z, h: gs.h, fresh: false });
    else { const k = 1 - Math.pow(0.001, dt); ghostView.x += (gs.x - ghostView.x) * k; ghostView.z += (gs.z - ghostView.z) * k; ghostView.h += angDiff(gs.h, ghostView.h) * k; }
    const sinceAct = (Date.now() - gs.a) / 1000, flash = playing && sinceAct < 0.8 ? 0.55 * (1 - sinceAct / 0.8) : 0;
    const op = hunting ? 0.45 + 0.35 * Math.abs(Math.sin(t * 9)) * (Math.sin(t * 2.3) > -0.6 ? 1 : 0.2) : Math.max(flash, ATTRACT && playing ? 0.18 : 0);
    ghostMat.opacity = op; ghostObj.userData.eyeMat.opacity = op * 1.5; ghostObj.userData.haze.material.opacity = op * 0.8;
    ghostMat.emissive.set(hunting ? "#ff5d8a" : "#9fb4ff"); ghostObj.userData.haze.material.color.set(hunting ? "#ff4d7a" : "#a8b8ff");
    ghostObj.position.set(ghostView.x, 0.15 + Math.sin(t * 2) * 0.12, ghostView.z); ghostObj.rotation.y = ghostView.h;
    const danger = hunting && !g.dead[net.sessionId] && !g.out[net.sessionId] ? Math.max(0, 1 - dist(ghostView, me) / 12) : 0;
    $("fear").style.opacity = ATTRACT ? danger * 0.4 : g.dead[net.sessionId] && playing ? 0.6 : Math.max(danger, me.san < 25 && playing ? 0.25 : 0);
    if (danger > 0.1 && now > nextBeat) { nextBeat = now + 1100 - 700 * danger; sound("beat"); }
    // Lamps flicker near a scare and go red in a hunt.
    for (const l of lamps) if (l) {
      const near = dist(l.L.position, ghostView) < 9, fl = (hunting || (flash > 0 && near)) && Math.sin(t * 31 + l.room) > 0.2;
      l.L.intensity = fl ? 2 : 18; l.L.color.set(hunting ? "#ff6080" : "#ffd9a0"); l.bulb.material.opacity = fl ? 0.2 : 0.9;
    }
    // Frost breath in a freezing ghost room.
    if (g.found[1] && playing && Math.random() < dt * 4) for (const c of lit) if (roomAt(c.x, c.z) === g.room && c.on) burst(c.x + Math.sin(c.h) * 0.4, 1.5, c.z + Math.cos(c.h) * 0.4, "#cfefff", 1, 0.6, 0.4);
  }
  // Evidence props in the ghost's room: handprints (bright under UV), the written-in book.
  const tiles = roomTiles[g.room] || [];
  hands.forEach((m, i) => { const p = tiles[(i * 7 + g.id) % tiles.length]; m.visible = !!g.found[3] && !!p; if (p) { m.position.set(p.x + ((i * 37) % 10) / 10 - 0.5, 0.03, p.z + ((i * 53) % 10) / 10 - 0.5); m.rotation.z = i * 1.7; } m.material.opacity = me.tool === 3 ? 0.95 : 0.25; });
  const bp = tiles[(g.id * 5) % Math.max(1, tiles.length)];
  book.visible = !!g.found[4] && !!bp; if (bp) book.position.set(bp.x, 0.06, bp.z);
  exitRing.material.opacity = g.phase === "escape" ? 0.6 + 0.4 * Math.sin(t * 8) : 0.35;
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i]; b.life -= dt; b.vy -= 2 * dt; b.s.position.x += b.vx * dt; b.s.position.y = Math.max(0.05, b.s.position.y + b.vy * dt); b.s.position.z += b.vz * dt;
    b.s.material.opacity = Math.max(0, b.life); if (b.life <= 0) { scene.remove(b.s); bits.splice(i, 1); }
  }
  // Camera: high and behind; when you're dead it follows a teammate. ?attract follows the action.
  let focus = me;
  if (g.dead[net.sessionId] && !ATTRACT) { const alive = people().filter((c) => !g.dead[c.id] && !c.mine)[0]; if (alive) focus = alive; }
  if (ATTRACT && gs) { // the ghost's room while testing, the ghost while it hunts
    const crew = people().filter((c) => !g.dead[c.id] && inside(c)), near = crew.sort((a, b) => dist(a, ghostView) - dist(b, ghostView))[0];
    focus = hunting && near ? { x: (ghostView.x + near.x) / 2, z: (ghostView.z + near.z) / 2 } : g.phase === "escape" ? { x: (EXIT.x + ghostView.x) / 2, z: (EXIT.z + ghostView.z) / 2 + 2 } : near ? { x: (near.x * 2 + ghostView.x) / 3, z: (near.z * 2 + ghostView.z) / 3 } : ghostView;
  }
  const tall = camera.aspect < 1, hgt = ATTRACT ? 11 : tall ? 24 : 15, back = ATTRACT ? 7 : tall ? 11 : 9;
  camLook.lerp(new THREE.Vector3(focus.x, 0, focus.z), 1 - Math.pow(ATTRACT ? 0.2 : 0.02, dt));
  camPos.set(camLook.x, hgt, camLook.z + back);
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(new THREE.Vector3((Math.random() - 0.5) * shake, 0, (Math.random() - 0.5) * shake));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  if (now - lastHud > 120) { lastHud = now; hud(g, gs); fixColor(); }
}

(async function start() {
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("mark", (msg, from) => { if (isHost() && msg) { const p = S.entities.players?.[from]; markIntent(+msg.k, (p && p.n) || "Someone"); } });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "reveal") host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  const pk = net.offline ? "" : await Seal.init().catch(() => "");
  net.me.set({ n: myName, c: myColor, hb: Date.now(), ...(pk ? { pk } : {}) });
  camLook.set(me.x, 0, me.z);
  drawTools();
  if (PARAMS.has("test")) window.__test = { game, writeGame, people, me, host, isHost, ghostState, botList, input, fits, setTool };
  requestAnimationFrame(frame);
})();
</script>
